<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic IT Competition Buttons</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#eef8ff,#ffffff);
      padding:30px;
    }

    /* Container */
    .it-wrapper{
      width:100%;
      overflow-x:auto;
    }

    .it-buttons{
      display:flex;
      gap:18px;
      width:max-content;
      min-width:100%;
      justify-content:center;
      flex-wrap:nowrap;
      padding:10px;
    }

    /* Button */
    .it-btn{
      position:relative;
      min-width:180px;
      height:80px;
      border-radius:22px;
      text-decoration:none;
      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      background:rgba(255,255,255,0.75);
      border:1px solid rgba(120,190,255,0.35);

      backdrop-filter:blur(12px);

      color:#2196f3;
      font-weight:700;
      font-size:1.25rem;
      letter-spacing:1px;

      transition:all .35s ease;

      box-shadow:
        0 10px 25px rgba(33,150,243,0.08);
    }

    /* Shine Effect */
    .it-btn::before{
      content:'';
      position:absolute;
      top:0;
      left:-130%;
      width:100%;
      height:100%;
      background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.7),
        transparent
      );
      transition:.7s;
    }

    .it-btn:hover::before{
      left:130%;
    }

    /* Hover */
    .it-btn:hover{
      transform:translateY(-6px) scale(1.03);
      background:linear-gradient(135deg,#6ec6ff,#42a5f5);
      color:white;

      box-shadow:
        0 18px 35px rgba(33,150,243,0.25);
    }

    .title{
      transition:.3s;
      z-index:2;
    }

    .desc{
      position:absolute;
      bottom:14px;
      font-size:.72rem;
      font-weight:500;
      opacity:0;
      transform:translateY(10px);
      transition:.3s;
      text-align:center;
      padding:0 10px;
      line-height:1.2;
    }

    .it-btn:hover .title{
      transform:translateY(-8px);
    }

    .it-btn:hover .desc{
      opacity:1;
      transform:translateY(0);
    }

    /* Responsive */
    @media(max-width:768px){

      .it-buttons{
        justify-content:flex-start;
      }

      .it-btn{
        min-width:160px;
        height:75px;
        font-size:1.05rem;
      }

      .desc{
        font-size:.65rem;
      }
    }

  </style>
</head>

<body>

  <div class="it-wrapper">
    <div class="it-buttons">

      <a href="#" class="it-btn">
        <span class="title">ITCS</span>
        <span class="desc">IT CYBER SECURITY</span>
      </a>

      <a href="#" class="it-btn">
        <span class="title">ITGDT</span>
        <span class="desc">IT GRAPHIC DESIGN TECHNOLOGY</span>
      </a>

      <a href="#" class="it-btn">
        <span class="title">ITNSA</span>
        <span class="desc">IT NETWORK SYSTEM ADMINISTRATION</span>
      </a>

      <a href="#" class="it-btn">
        <span class="title">ITINC</span>
        <span class="desc">IT INFORMATION NETWORK CABLING</span>
      </a>

      <a href="#" class="it-btn">
        <span class="title">ITWT</span>
        <span class="desc">IT WEB TECHNOLOGIES</span>
      </a>

    </div>
  </div>

</body>
</html>
